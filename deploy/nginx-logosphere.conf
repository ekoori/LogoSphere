# LogoSphere on the production host.
#
# The site is logosphere.earth (since 2026-11-24). ts.krbavcic.com, its first
# address, still answers the API for apps installed before the move (they call
# it directly, and OkHttp carries neither a POST nor the Authorization header
# across a redirect), plus the app's place picker page; every other page there
# has moved to logosphere.earth for good (301).

server {
    server_name logosphere.earth;

    root /srv/logosphere/frontend/build;
    index index.html;

    # Banner/profile image uploads (multipart) — allow a few MB.
    client_max_body_size 12M;

    # API -> Flask backend
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Vite's content-hashed build output (/assets/index-<hash>.js): a new
    # build gets new names, so these can be cached for good.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Images shipped with the app under fixed names: cache, but not forever.
    location /static/ {
        try_files $uri =404;
        expires 7d;
    }

    # SPA client-side routing fallback. index.html names the current bundle,
    # so browsers must revalidate it (an ETag makes that a cheap 304) - with
    # no Cache-Control they cached it heuristically and kept running an old
    # build for days after a deploy.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    listen [::]:443 ssl ipv6only=on;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/logosphere.earth/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/logosphere.earth/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# www.logosphere.earth -> logosphere.earth
server {
    server_name www.logosphere.earth;
    return 301 https://logosphere.earth$request_uri;

    listen [::]:443 ssl;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/logosphere.earth/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/logosphere.earth/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# The first address. The API and the place picker stay for apps older than
# 0.3.3; everything else moves to logosphere.earth. Drop this block (and let
# its certificate lapse) once no such app is in use.
server {
    server_name ts.krbavcic.com;

    root /srv/logosphere/frontend/build;
    client_max_body_size 12M;

    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # The app's place picker is this page in a WebView that trusts only its
    # own server's host, so the page and the bundle it loads stay here too.
    location = /map-picker {
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location /static/ {
        try_files $uri =404;
        expires 7d;
    }

    location / {
        return 301 https://logosphere.earth$request_uri;
    }

    listen [::]:443 ssl;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/ts.krbavcic.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/ts.krbavcic.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# Plain HTTP. Certbot renews both certificates through these two blocks (its
# challenge location is an exact match, so it wins over "location /").
server {
    listen 80;
    listen [::]:80;
    server_name logosphere.earth www.logosphere.earth;

    location / {
        return 301 https://logosphere.earth$request_uri;
    }
}

server {
    if ($host = ts.krbavcic.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name ts.krbavcic.com;
    return 404; # managed by Certbot


}
