    get:
      summary: "The demo spheres (AI personas play everyday neighbours there) and whether you have joined each"
      operationId: getDemo
      tags: [Spheres]
      responses:
        '200': { description: "{spheres: [{id, name, description, joined, member_count}], joined_any, joined_all}" }
        '401': { description: 'No session, or it expired.' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/demo/join:
    post:
      summary: "Join every demo sphere that anyone may join, in one go (and clear the invitation)"
      operationId: joinDemo
      tags: [Spheres]
      responses:
        '200': { description: "{joined: [sphere ids newly joined], spheres: [...]}" }
        '401': { description: 'No session, or it expired.' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/trails/{trail_id}:
    get:
      summary: A Meaning Trail as one timeline
      description: >-
        `trail_id` is a person's, sphere's, alliance's, project's or exchange's
        id. Entries are newest first: an exchange (`type: exchange`, limited to
        those the viewer may open), or a run of acknowledgements with no
        exchange between them (`type: acknowledgements`). Each item in a run
        says whether it is `highlighted` (two at most) and whether it stays
        `shown` while the run is folded (runs of three or more fold to the
        highlighted ones, else the newest). A person's trail is open to
        members; a group's to its sphere; an exchange's to whoever can see it.
      operationId: getTrail
      parameters:
        - { name: trail_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: "trail_id, kind, name, can_acknowledge, can_highlight, max_highlights, entries" }
        '404': { description: Not found, or not the viewer's to see }
      tags: [Meaning Trail]

  /api/trails/{trail_id}/acknowledgements:
    post:
      summary: Acknowledge on any Meaning Trail
      description: >-
        Anyone may, except in spheres they aren't in (a platform admin's
        override doesn't write). Text only, up to 1000 characters; up to five
        value cards by id, stored as they read on the server.
      operationId: addAcknowledgement
      parameters:
        - { name: trail_id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, maxLength: 1000 }
                card_ids: { type: array, items: { type: string, format: uuid } }
      responses:
        '201': { description: Added }
        '400': { description: No text, or too much }
        '403': { description: Not in that sphere }
        '404': { description: No such trail, or not the caller's to see }
      tags: [Meaning Trail]

  /api/trails/{trail_id}/acknowledgements/{ack_id}:
    delete:
      summary: Remove an acknowledgement
      description: Its author, the trail's owner, or a platform admin.
      operationId: removeAcknowledgement
      parameters:
        - { name: trail_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: ack_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Removed }
        '403': { description: Not the caller's to remove }
        '404': { description: Not found }
      tags: [Meaning Trail]

  /api/trails/{trail_id}/acknowledgements/{ack_id}/like:
    post:
      summary: Appreciate an acknowledgement
      description: Not your own. `liked` sets the state; without it the like toggles.
      operationId: likeAcknowledgement
      parameters:
        - { name: trail_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: ack_id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { liked: { type: boolean } } }
      responses:
        '200': { description: "liked, count, by" }
        '403': { description: It is the caller's own }
        '404': { description: Not found }
      tags: [Meaning Trail]

  /api/trails/{trail_id}/acknowledgements/{ack_id}/highlight:
    post:
      summary: Highlight an acknowledgement on your trail
      description: >-
        The trail's owner only: that person, the group's own managers, or
        either side of an exchange. Two at most in each run.
      operationId: highlightAcknowledgement
      parameters:
        - { name: trail_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: ack_id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { highlighted: { type: boolean, default: true } } }
      responses:
        '200': { description: highlighted }
        '403': { description: Not the trail's owner }
        '404': { description: Not found }
        '409': { description: Two in that run are highlighted already }
      tags: [Meaning Trail]

  /api/meaning_graph:
    get:
      summary: The Meaning Graph
      description: >-
        Every current value card the viewer may read (a node; its id is the
        card's first version, so it survives rewording), and the closeness of
        each card's strongest pairs. A pair scores the same for every viewer.
        Each edge carries its parts: words (with the shared words), people
        (from two), lineage, judges (from two) and the viewer's own judgement.
      operationId: getMeaningGraph
      responses:
        '200': { description: "method_version, shown_from, nodes, edges" }
      tags: [Meaning Graph]

  /api/meaning_graph/method:
    get:
      summary: How closeness is worked out
      description: The method in full (formula, weights, stop words, word families, rules, limits).
      operationId: getMeaningGraphMethod
      security: []
      responses:
        '200': { description: The method }
      tags: [Meaning Graph]

  /api/meaning_graph/judgement:
    post:
      summary: Say whether two cards are close
      description: >-
        One person, one judgement for each pair (`close: null` takes it back).
        Never a pair with your own card, or one of a group you manage, in it;
        AI personas never judge. It counts once two people have judged.
      operationId: judgeCloseness
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [a, b, close]
              properties:
                a: { type: string, format: uuid }
                b: { type: string, format: uuid }
                close: { type: boolean, nullable: true }
      responses:
        '200': { description: The pair's edge as it now stands }
        '400': { description: The same card twice, or close isn't true, false or null }
        '403': { description: Not the caller's to judge }
        '404': { description: Not cards the caller may see }
      tags: [Meaning Graph]

  /api/ai:
    get:
      summary: What AI help is on, and what is left of your day
      operationId: aiStatus
      responses:
        '200':
          description: For value cards and for pictures.
          content:
            application/json:
              schema:
                type: object
                properties:
                  value_cards: { $ref: '#/components/schemas/AiAllowance' }
                  pictures: { $ref: '#/components/schemas/AiAllowance' }
      tags: [AI help]

  /api/ai/value_card:
    post:
      summary: Draft a value card from your notes
      description: >-
        Sends what is typed here, and nothing about who typed it, to Anthropic's
        Claude. Returns a draft to edit and a question to think about. Saves
        nothing.
      operationId: aiValueCard
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                notes: { type: string, maxLength: 1500 }
                draft:
                  type: object
                  description: What is in the form so far (the card's own text fields).
                group: { type: boolean, description: "The card is a group's" }
                brief: { type: boolean, description: "Only title, care_about and because (Simple)" }
      responses:
        '200':
          description: A draft, unsaved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  draft: { type: object }
                  question: { type: string }
                  left: { type: integer }
        '400': { description: Nothing to work from. }
        '422': { description: The AI declined. }
        '429': { description: The day's help is used up. }
        '503': { description: AI help is off or not answering. }
      tags: [AI help]

  /api/ai/picture:
    post:
      summary: Draw a picture for an opening, group or event
      description: >-
        Sends the title, description and hint to OpenAI. The picture says it is
        AI-made, is remembered as such, and is saved only if you then upload it.
        Never for receipts: exchanges in real spheres refuse AI pictures as
        evidence, while demo spheres accept them.
      operationId: aiPicture
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [purpose, title]
              properties:
                purpose: { type: string, enum: [opening, sphere, alliance, project, event] }
                title: { type: string, maxLength: 120 }
                description: { type: string }
                hint: { type: string }
      responses:
        '200':
          description: A JPEG, unsaved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  image: { type: string, format: byte }
                  content_type: { type: string }
                  left: { type: integer }
        '400': { description: Not something AI draws for, or no title. }
        '422': { description: The AI declined. }
        '429': { description: The day's help is used up. }
        '503': { description: AI help is off or not answering. }
      tags: [AI help]

  /api/places/search:
    post:
      summary: Places by name
      description: >-
        Offline search over GeoNames data on this server. In the body, so what
        people look for stays out of URLs and logs. `available` is false when
        the data isn't installed: pins still work.
      operationId: searchPlaces
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                q: { type: string }
      responses:
        '200':
          description: Best first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  available: { type: boolean }
                  attribution: { type: object }
                  results: { type: array, items: { $ref: '#/components/schemas/FoundPlace' } }
      tags: [Places]

  /api/places/nearest:
    post:
      summary: Names to offer for a pin
      operationId: nearestPlaces
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [lat, lon]
              properties:
                lat: { type: number }
                lon: { type: number }
      responses:
        '200':
          description: Towns about it, nearest first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  available: { type: boolean }
                  results: { type: array, items: { $ref: '#/components/schemas/FoundPlace' } }
        '400': { description: Not a point on Earth. }
      tags: [Places]

  /api/places/{kind}/{owner_id}:
    parameters:
      - { name: kind, in: path, required: true, schema: { type: string, enum: [users, spheres, alliances, projects, openings, events] } }
      - { name: owner_id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: A place, whole
      description: >-
        Only for whoever may change it; a person's is theirs alone, platform
        admins included. Everyone else gets the words (`location`) and a banded
        `distance`, plus `point` on a group's or opening's detail when its
        people chose `exact` (a private sphere's only for those inside it).
      operationId: getPlace
      responses:
        '200':
          description: The place.
          content:
            application/json:
              schema:
                type: object
                properties:
                  place: { $ref: '#/components/schemas/Place' }
                  findable: { type: boolean, description: People only }
                  search_available: { type: boolean }
        '403': { description: Not yours to see whole. }
        '404': { description: No such thing. }
      tags: [Places]
    post:
      summary: Set or clear a place
      description: >-
        `place` is one from search (`id`), a pin (`lat`, `lon`, `precision`,
        `label`), only words (`label`), or null. A pin is rounded to its
        precision before it is stored. `findable` lets members nearby find a
        person; it is off unless sent true.
      operationId: setPlace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: "`place`, or for yourself `findable` alone, which leaves the place as it is."
              properties:
                place: { $ref: '#/components/schemas/Place' }
                findable: { type: boolean }
      responses:
        '200':
          description: >-
            As stored. `id` is whose it now is: an opening an exchange came from
            keeps where that was agreed, so a new place makes a new version.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  place: { $ref: '#/components/schemas/Place' }
                  findable: { type: boolean, description: People only }
        '400': { description: Not a place. }
        '403': { description: Not yours to change. }
        '404': { description: No such thing. }
        '409': { description: A past version of an opening. }
      tags: [Places]

  /api/nearby:
    get:
      summary: Who and what is near you
      description: >-
        Members who chose to be findable, and spheres, by banded distance from
        your own place. Distances are worked out between 1 km squares and never
        told more finely than a band.
      operationId: nearby
      parameters:
        - { name: km, in: query, schema: { type: integer, enum: [5, 10, 25, 50, 100, 250], default: 25 } }
      responses:
        '200':
          description: Nearest band first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  has_place: { type: boolean }
                  findable: { type: boolean }
                  km: { type: integer }
                  people: { type: array, items: { type: object } }
                  spheres: { type: array, items: { type: object } }
        '400': { description: Not one of the distances offered. }
      tags: [Places]

  /api/mail:
    get:
      summary: Whether LogoSphere can send email
      description: Decides the join and forgotten-password forms a client shows.
      operationId: mailStatus
      security: []
      responses:
        '200':
          description: The answer.
          content:
            application/json:
              schema: { type: object, properties: { 'on': { type: boolean } } }
      tags: [Email]

  /api/register/confirm:
    post:
      summary: Finish joining with the emailed link
      operationId: finishSignUp
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string, description: From the link's fragment }
                password: { type: string, minLength: 8 }
      responses:
        '200':
          description: The account exists and its address is confirmed. Sign in with POST /api/login.
          content:
            application/json:
              schema:
                type: object
                properties:
                  reg_success: { type: boolean }
                  user_id: { type: string, format: uuid }
                  email: { type: string, format: email }
                  message: { type: string }
        '400': { description: "The link expired or was used, the address has an account, or the password is too short." }
      tags: [Email]

  /api/password/forgot:
    post:
      summary: Email me a reset link
      description: The answer is the same whether or not the address has an account.
      operationId: forgotPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '200': { description: "If there is an account, a link is on its way." }
        '400': { description: No address. }
        '429': { description: Too many tries from this connection. }
        '503': { description: Email is off. }
      tags: [Email]

  /api/email/confirm:
    post:
      summary: Confirm an address with its link
      operationId: confirmEmail
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        '200': { description: Confirmed. }
        '400': { description: The link expired or was used. }
      tags: [Email]

  /api/account/email:
    get:
      summary: Your email settings
      operationId: getEmailSettings
      responses:
        '200':
          description: Yours.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmailSettings' }
      tags: [Email]
    post:
      summary: Choose which notifications are emailed
      description: >-
        All off until chosen, and nothing goes to an address that isn't
        confirmed: switching on the first topic mails the confirmation link.
      operationId: chooseEmailTopics
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [topics]
              properties:
                topics: { type: array, items: { type: string, enum: [exchanges, messages, groups, thanks, personas] } }
      responses:
        '200':
          description: As saved, plus `confirmation_sent`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmailSettings' }
        '400': { description: Not a topic. }
      tags: [Email]

  /api/account/email/confirm:
    post:
      summary: Send me the confirmation link
      operationId: sendEmailConfirmation
      responses:
        '200': { description: "On its way, or confirmed already." }
        '400': { description: The address can't receive email. }
        '503': { description: Email is off. }
      tags: [Email]

  /api/email/unsubscribe/{unsubscribe_token}:
    parameters:
      - { name: unsubscribe_token, in: path, required: true, schema: { type: string } }
    get:
      summary: The unsubscribe page
      description: Only redirects to the page with the button; changes nothing.
      operationId: unsubscribePage
      security: []
      responses:
        '302': { description: To /unsubscribe. }
      tags: [Email]
    post:
      summary: Stop notification emails
      description: >-
        One-click unsubscribe (RFC 8058): no session, any body. The token can
        do nothing but switch these emails off.
      operationId: unsubscribe
      security: []
      responses:
        '200': { description: All topics are off. }
        '400': { description: Not a link of ours. }
      tags: [Email]

  /api/meaning_graph/card/{card_id}:
    get:
      summary: The dot a value card is on the Meaning Graph
      description: >-
        Nodes are named by a card's first version; any version finds it.
        404 when the viewer can't see that card on the graph.
      operationId: getCardNode
      parameters:
        - { name: card_id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: The node's id.
          content:
            application/json:
              schema: { type: object, properties: { id: { type: string } } }
        '404': { description: Not on the graph the viewer can see. }
      tags: [Meaning Graph]

  /api/messages:
    get:
      summary: Your conversations
      description: Always between two people. Newest first.
      operationId: listConversations
      responses:
        '200':
          description: Yours.
          content:
            application/json:
              schema:
                type: object
                properties:
                  unread_count: { type: integer }
                  conversations:
                    type: array
                    items:
                      type: object
                      properties:
                        person: { type: object, properties: { id: { type: string }, name: { type: string } } }
                        last: { type: object, properties: { text: { type: string }, at: { type: string }, mine: { type: boolean } } }
                        unread: { type: boolean }
      tags: [Messages]

  /api/messages/{person_id}:
    parameters:
      - { name: person_id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: One conversation
      description: >-
        Readable by the two in it, and by nobody else, administrators
        included. Oldest first within a page; `before` fetches older ones.
        `about` (kind:id, kind one of opening, sphere, alliance, project,
        event) says what it is about; when the other person runs that, you
        may write. `opening=<id>` is the older way to say about=opening:<id>.
      operationId: getConversation
      parameters:
        - { name: before, in: query, schema: { type: string }, description: "A message id" }
        - { name: about, in: query, schema: { type: string }, description: "kind:id" }
        - { name: opening, in: query, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The page, with whether you may write.
          content:
            application/json:
              schema:
                type: object
                properties:
                  person: { type: object }
                  messages: { type: array, items: { $ref: '#/components/schemas/DirectMessage' } }
                  more: { type: boolean }
                  about: { type: object, nullable: true }
                  can_send: { type: boolean }
                  why_not: { type: string, nullable: true }
                  blocked: { type: boolean, description: You blocked them }
        '404': { description: No such person. }
      tags: [Messages]
    post:
      summary: Write to someone
      description: >-
        To start, you share a sphere, they follow you or chose to be found
        nearby, or what it is `about` is run by them (an opening they posted
        or responded to as you did, a group they founded, an event they
        host). `opening_id` is the older way to name an opening. A conversation
        that exists carries on until one blocks the other. AI personas neither
        read nor send messages.
      operationId: sendMessage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, maxLength: 2000 }
                about:
                  type: object
                  properties:
                    kind: { type: string, enum: [opening, sphere, alliance, project, event] }
                    id: { type: string, format: uuid }
                opening_id: { type: string, format: uuid }
      responses:
        '201':
          description: Sent.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  sent: { $ref: '#/components/schemas/DirectMessage' }
        '400': { description: "Empty, or too long." }
        '403': { description: "Not allowed. A block reads the same as any refusal." }
        '404': { description: No such person. }
        '429': { description: Too many. }
      tags: [Messages]

  /api/messages/{person_id}/read:
    parameters:
      - { name: person_id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Mark a conversation read
      operationId: readConversation
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                up_to: { type: string, description: The last message seen (all when left out) }
      responses:
        '200': { description: "`unread` says whether any are left." }
        '400': { description: Not a message id. }
      tags: [Messages]

  /api/openings/{service_id}/message_respondents:
    parameters:
      - { name: service_id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Write privately to everyone who responded
      description: >-
        For whoever runs the opening. Each gets a message of their own and
        doesn't learn who else responded.
      operationId: messageRespondents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, maxLength: 2000 }
      responses:
        '200': { description: "`sent` and `skipped` count them." }
        '400': { description: "No words, or nobody to write to." }
        '403': { description: Not yours. }
        '404': { description: No such opening. }
        '429': { description: Too many. }
      tags: [Messages]

  /api/blocks:
    get:
      summary: Whom you blocked
      operationId: listBlocks
      responses:
        '200':
          description: Yours alone.
          content:
            application/json:
              schema: { type: array, items: { type: object } }
      tags: [Safety]

  /api/blocks/{person_id}:
    parameters:
      - { name: person_id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Block or unblock someone
      description: >-
        Either way round, the two can't then message, follow, take up each
        other's openings, acknowledge on each other's trails or exchanges, or
        be found near each other. They aren't told.
      operationId: setBlock
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [blocked]
              properties:
                blocked: { type: boolean }
      responses:
        '200': { description: As it is now. }
        '400': { description: "Yourself, or neither true nor false." }
        '404': { description: No such person. }
      tags: [Safety]

  /api/reports:
    post:
      summary: Report to the administrators
      description: >-
        What was reported is read on the server, never taken from the client.
        The person reported isn't told.
      operationId: makeReport
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, id]
              properties:
                kind: { type: string, enum: [person, message, acknowledgement, opening, event, announcement] }
                group_id: { type: string, description: "An announcement: whose" }
                id: { type: string }
                person_id: { type: string, description: "A message: who you were talking with" }
                trail_id: { type: string, description: "An acknowledgement: whose trail" }
                note: { type: string, maxLength: 1000, description: Required for a person }
      responses:
        '201': { description: Filed. }
        '400': { description: Not reportable. }
        '404': { description: "Not there, or not yours to see." }
        '429': { description: Too many. }
      tags: [Safety]

  /api/admin/reports:
    get:
      summary: The reports queue
      operationId: listReports
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [open, handled, dismissed, all], default: open } }
      responses:
        '200': { description: "`open` counts those waiting; `reports` newest first." }
        '403': { description: Platform administrators only. }
      tags: [Administration]

  /api/admin/reports/{report_id}:
    parameters:
      - { name: report_id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Settle a report
      description: "`remove` also deletes a reported message or acknowledgement."
      operationId: settleReport
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [handled, dismissed] }
                note: { type: string }
                remove: { type: boolean }
      responses:
        '200': { description: Saved. }
        '400': { description: "Neither, or nothing removable." }
        '403': { description: Platform administrators only. }
        '404': { description: No such report. }
      tags: [Administration]

  /api/events:
    get:
      summary: What's on, soonest first
      operationId: listEvents
      parameters:
        - { name: group, in: query, schema: { type: string, format: uuid } }
      responses:
        '200': { description: "`events`: each an Event with `upcoming`, its next time. Only what you may see." }
        '400': { description: "Not a group id." }
      tags: [Events]
    post:
      summary: Put on an event
      operationId: createEvent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventFields' }
      responses:
        '201': { content: { application/json: { schema: { $ref: '#/components/schemas/Event' } } }, description: Made. The group's members are told. }
        '400': { description: "No name, time or zone, or it has passed." }
        '403': { description: "Not a member of that group." }
        '404': { description: "No such group." }
        '429': { description: "Too many for one day." }
      tags: [Events]

  /api/events/{event_id}:
    parameters:
      - { name: event_id, in: path, required: true, schema: { type: string } }
    get:
      summary: One event
      operationId: getEvent
      responses:
        '200': { content: { application/json: { schema: { $ref: '#/components/schemas/Event' } } }, description: The event. }
        '404': { description: "Not there, or not yours to see." }
      tags: [Events]
    patch:
      summary: Change an event
      operationId: editEvent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventFields' }
      responses:
        '200': { content: { application/json: { schema: { $ref: '#/components/schemas/Event' } } }, description: The event. }
        '400': { description: "Not an event." }
        '403': { description: "Not yours to change." }
        '404': { description: "Not there." }
        '409': { description: "Cancelled." }
      tags: [Events]

  /api/events/{event_id}/cancel:
    parameters:
      - { name: event_id, in: path, required: true, schema: { type: string } }
    post:
      summary: Cancel it, or one of its dates
      operationId: cancelEvent
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, properties: { day: { type: string, format: date }, cancelled: { type: boolean } } }
      responses:
        '200': { content: { application/json: { schema: { $ref: '#/components/schemas/Event' } } }, description: The event. }
        '400': { description: "Not one of its dates." }
        '403': { description: "Not yours to change." }
        '404': { description: "Not there." }
        '409': { description: "All of it was cancelled already." }
      tags: [Events]

  /api/events/{event_id}/reply:
    parameters:
      - { name: event_id, in: path, required: true, schema: { type: string } }
    post:
      summary: Say whether you are coming
      operationId: replyEvent
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [day, answer], properties: { day: { type: string, format: date }, answer: { type: string, nullable: true, enum: [going, maybe, "no", null] } } }
      responses:
        '200': { content: { application/json: { schema: { $ref: '#/components/schemas/Event' } } }, description: The event. }
        '400': { description: "Not a date or answer." }
        '404': { description: "Not there." }
        '409': { description: "That one isn't on." }
      tags: [Events]

  /api/events/{event_id}/image:
    parameters:
      - { name: event_id, in: path, required: true, schema: { type: string } }
    get:
      summary: An event's picture
      operationId: getEventImage
      responses:
        '200': { description: The picture, privately cacheable. }
        '404': { description: "None, or not yours to see." }
      tags: [Events]
    post:
      summary: Set an event's picture
      operationId: setEventImage
      responses:
        '200': { description: "Saved (multipart, field image)." }
        '400': { description: "Not a picture." }
        '403': { description: "Not yours to change." }
        '404': { description: "Not there." }
      tags: [Events]

  /api/announcements/{group_id}:
    parameters:
      - { name: group_id, in: path, required: true, schema: { type: string } }
    get:
      summary: A group's announcements
      operationId: listAnnouncements
      responses:
        '200': { description: "`announcements` newest first, and `can_announce`." }
        '404': { description: "Not there, or not yours to read." }
      tags: [Announcements]
    post:
      summary: Announce to a group's members
      operationId: makeAnnouncement
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [text], properties: { text: { type: string, maxLength: 2000 } } }
      responses:
        '201': { description: Announced. Notifications never carry its words. }
        '400': { description: "No words." }
        '403': { description: "Not a manager." }
        '404': { description: "Not there." }
        '429': { description: "Enough for one day." }
      tags: [Announcements]

  /api/announcements/{group_id}/{announcement_id}:
    parameters:
      - { name: group_id, in: path, required: true, schema: { type: string } }
      - { name: announcement_id, in: path, required: true, schema: { type: string } }
    delete:
      summary: Remove an announcement
      operationId: removeAnnouncement
      responses:
        '200': { description: Done. }
        '403': { description: "Neither its writer nor a manager." }
        '404': { description: "Not there." }
      tags: [Announcements]

  /api/invites:
    get:
      summary: Invitations you made
      operationId: listInvites
      responses:
        '200': { description: "Yours, with how many joined. Never the codes." }
      tags: [Invitations]
    post:
      summary: Make an invitation link
      operationId: makeInvite
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, properties: { group_id: { type: string, format: uuid } } }
      responses:
        '201': { description: "`path` is the link, with its code in the fragment: shown only now." }
        '403': { description: "Not yours to invite to." }
        '404': { description: "No such group." }
        '429': { description: "Too many out." }
      tags: [Invitations]

  /api/invites/look:
    post:
      summary: Who invites to what
      operationId: lookInvite
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [code], properties: { code: { type: string } } }
      responses:
        '200': { description: Done. }
        '404': { description: "It doesn't work." }
      tags: [Invitations]

  /api/invites/accept:
    post:
      summary: Use an invitation
      operationId: acceptInvite
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [code], properties: { code: { type: string } } }
      responses:
        '200': { description: Done. }
        '404': { description: "It doesn't work." }
      tags: [Invitations]

  /api/invites/{invite_id}/revoke:
    parameters:
      - { name: invite_id, in: path, required: true, schema: { type: string } }
    post:
      summary: Revoke an invitation
      operationId: revokeInvite
      responses:
        '200': { description: Done. }
        '404': { description: "Not one of yours." }
      tags: [Invitations]

  /api/openings/{service_id}/spheres:
    parameters:
      - { name: service_id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Share an opening with more spheres
      operationId: shareOpening
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sphere_ids]
              properties:
                sphere_ids:
                  type: array
                  maxItems: 10
                  items: { type: string, format: uuid }
                  description: All of them, replacing what was. Empty shares it with none.
      responses:
        '200': { description: The opening. }
        '400': { description: "Not spheres, already for everyone, or demo mixed with real." }
        '403': { description: "Not yours to share, or a sphere you aren't in." }
        '404': { description: Not there. }
        '409': { description: A past version. }
      tags: [Openings]

  /api/activity:
    get:
      summary: What the people you follow did lately
      operationId: getActivity
      responses:
        '200':
          description: >-
            `activity`, newest first: kind (opening, exchange, acknowledgement, event), at, who, says, title,
            link and is_demo. Only what the caller may open anyway; a block either way hides it.
      tags: [User Management]

  /api/users/{target_id}/known:
    parameters:
      - { name: target_id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Whom you both know
      operationId: getKnown
      responses:
        '200':
          description: >-
            `people` the caller follows or had an exchange with, who had an exchange with this person. Only
            exchanges the caller can see count, and nobody learns whom someone else follows.
      tags: [User Management]

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >-
        `Authorization: Bearer <session_id>`, where `session_id` is the token
        returned by `POST /api/login`. See the top-level Authentication
        section for the full model (server-stored sessions; cookie transport
        for the reference web client). Applies to every endpoint except
        `/api/login`, `/api/register`, `/api/check_session`, and the public
        image/GET endpoints, which are marked `security: []` individually.

  parameters:
    TargetId:
      name: target_id
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: The id of the user being acted on.
    ProjectId:
      name: project_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ExchangeId:
      name: exchange_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    SphereId:
      name: sphere_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    AllianceId:
      name: alliance_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ServiceId:
      name: service_id
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: An opening's id.
    CardId:
      name: card_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    EntityId:
      name: entity_id
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: A sphere, alliance, or project id.

  responses:
    InternalError:
      description: Unexpected server-side failure.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      properties:
        message: { type: string }
      description: >-
        The standard error body. A few auth endpoints (`/api/login`,
        `/api/logout`, `/api/check_session`) predate this convention and use
        `{"error": string}` with the same meaning instead.

    User:
      type: object
      properties:
        user_id: { type: string, format: uuid }
        email: { type: string, format: email }
        name: { type: string }
        surname: { type: string }
        location: { type: string }
        has_picture:
          type: boolean
          description: The picture itself is served by /api/users/{id}/avatar.
        is_agent: { type: boolean, description: An AI persona of the demo. }
        is_platform_admin: { type: boolean }
        ui_mode:
          type: string
          enum: [simple, advanced]
          description: Only ever present about yourself.

    AiAllowance:
      type: object
      properties:
        'on': { type: boolean }
        left: { type: integer }

    Place:
      type: object
      nullable: true
      properties:
        id: { type: integer, description: From a search; sending it is enough. }
        label: { type: string, maxLength: 120, description: The words others see. }
        lat: { type: number }
        lon: { type: number }
        precision:
          type: string
          enum: [exact, 1km, 5km, 10km, 100km, postcode, town, region, country]
          description: A pin takes the first five; the others come from search.

    FoundPlace:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        label: { type: string }
        precision: { type: string, enum: [postcode, town, region, country] }
        lat: { type: number }
        lon: { type: number }

    EmailSettings:
      type: object
      properties:
        'on': { type: boolean, description: LogoSphere can send email }
        email: { type: string, format: email }
        can_receive: { type: boolean }
        confirmed: { type: boolean }
        topics: { type: array, items: { type: string } }
        choices:
          type: array
          items:
            type: object
            properties:
              key: { type: string }
              label: { type: string }
              about: { type: string }
        confirmation_sent: { type: boolean, description: Only in answer to a change }

    DirectMessage:
      type: object
      properties:
        id: { type: string }
        text: { type: string }
        at: { type: string, description: UTC }
        mine: { type: boolean }
        opening:
          type: object
          nullable: true
          properties: { id: { type: string }, title: { type: string } }

    EventFields:
      type: object
      description: Required when making one, `title`, `starts` and `tz`.
      properties:
        title: { type: string, maxLength: 120 }
        description: { type: string }
        host_id: { type: string, format: uuid, description: "The group putting it on, when making one. None is for everyone" }
        starts: { type: string, example: "2027-03-25T19:00", description: The wall-clock time in `tz` }
        tz: { type: string, example: Europe/Paris }
        length_min: { type: integer, minimum: 15, maximum: 10080 }
        repeats: { type: string, enum: [never, weekly, fortnightly, monthly, monthly_weekday] }
        until: { type: string, format: date, nullable: true }

    Event:
      allOf:
        - $ref: '#/components/schemas/EventFields'
        - type: object
          properties:
            id: { type: string, format: uuid }
            host: { type: object, nullable: true }
            cancelled: { type: boolean }
            can_manage: { type: boolean }
            location: { type: string, nullable: true }
            distance: { type: object, nullable: true }
            point: { type: object, nullable: true, description: Only where it was shown exactly }
            times:
              type: array
              items:
                type: object
                properties:
                  day: { type: string, format: date, description: Its local date }
                  starts_at: { type: string, description: UTC }
                  ends_at: { type: string, description: UTC }
                  skipped: { type: boolean }
                  going: { type: integer }
                  maybe: { type: integer }
                  my_answer: { type: string, nullable: true }
                  people: { type: array, items: { type: object } }

    SessionStatus:
      type: object
      properties:
        status: { type: string, enum: [active, inactive] }
        user_id: { type: string, format: uuid, nullable: true }
        user_data:
          allOf:
            - $ref: '#/components/schemas/User'
          description: Present only when status is "active".

    MeaningTrailEntry:
      type: object
      description: One exchange, enriched with the viewer's perspective and per-comment like counts.
      properties:
        user_id: { type: string, format: uuid }
        exchange_id: { type: string, format: uuid }
        other_user_id: { type: string, format: uuid }
        other_user_name: { type: string }
        exchange_description: { type: string }
        exchange_long_description: { type: string }
        exchange_status:
          type: string
          enum: [Initiated, In Progress, Finished, Receipted, Additional Comments Added, Cancelled]
        project_id: { type: string, format: uuid, nullable: true }
        project_name: { type: string, nullable: true }
        project_start_timestamp: { type: string, format: date-time, nullable: true }
        gratitude_comment: { type: string, nullable: true }
        gratitude_comment_id: { type: string, format: uuid, nullable: true }
        gratitude_comment_timestamp: { type: string, format: date-time, nullable: true }
        gratitude_comment_context: { type: string, nullable: true }
        gratitude_comment_cards:
          type: array
          items: { $ref: '#/components/schemas/ValueCard' }
        user_comment: { type: string, nullable: true }
        user_comment_id: { type: string, format: uuid, nullable: true }
        user_comment_timestamp: { type: string, format: date-time, nullable: true }
        user_comment_cards:
          type: array
          items: { $ref: '#/components/schemas/ValueCard' }
        other_comment: { type: string, nullable: true }
        other_comment_id: { type: string, format: uuid, nullable: true }
        other_comment_author_id: { type: string, format: uuid, nullable: true }
        other_comment_author_name: { type: string, nullable: true }
        other_comment_timestamp: { type: string, format: date-time, nullable: true }
        other_comment_cards:
          type: array
          items: { $ref: '#/components/schemas/ValueCard' }
        initiator_comment: { type: string, nullable: true }
        initiator_comment_timestamp: { type: string, format: date-time, nullable: true }
        recipient_comment: { type: string, nullable: true }
        recipient_comment_timestamp: { type: string, format: date-time, nullable: true }
        initiator_acting_user_id:
          type: string
          format: uuid
          nullable: true
          description: Set when the initiator posted this exchange on behalf of an entity they manage.
        initiator_acting_user_name: { type: string, nullable: true }
        has_image: { type: boolean }
        likes:
          type: object
          additionalProperties:
            type: object
            properties:
              count: { type: integer }
              liked: { type: boolean }
        initiator_id: { type: string, format: uuid }
        initiator_name: { type: string }
        viewer_is_initiator: { type: boolean }

    SphereInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: string }
        meaning_graph: { type: string }
        location: { type: string }
        image: { type: string, format: binary }

    Sphere:
      type: object
      properties:
        sphere_id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        meaning_graph: { type: string }
        location: { type: string }
        image: { type: string, nullable: true, description: Base64-encoded. }
        admin1: { type: string, format: uuid }
        participants:
          type: array
          items: { type: string, format: uuid }
        participant_names:
          type: array
          items: { type: string }
        members:
          type: array
          items: { $ref: '#/components/schemas/MemberRef' }
        alliances:
          type: array
          items: { type: string, format: uuid }
        projects:
          type: array
          items: { type: string, format: uuid }
        values:
          type: array
          items: { type: string }

    MemberRef:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        role: { type: string }

    AllianceInput:
      type: object
      required: [name, sphere_id]
      properties:
        name: { type: string }
        sphere_id: { type: string, format: uuid }
        description: { type: string }
        meaning_graph: { type: string }
        values:
          type: array
          items: { type: string }
        projects:
          type: array
          items: { type: string, format: uuid }
        image: { type: string, format: binary }

    Alliance:
      type: object
      properties:
        alliance_id: { type: string, format: uuid }
        id: { type: string, format: uuid, description: Alias of alliance_id. }
        name: { type: string }
        description: { type: string }
        admin1: { type: string, format: uuid }
        sphere_id: { type: string, format: uuid }
        sphere_name: { type: string }
        participants:
          type: array
          items: { type: string }
          description: Member display names.
        members:
          type: array
          items: { $ref: '#/components/schemas/MemberRef' }
        projects:
          type: array
          items: { type: string, format: uuid }
        values:
          type: array
          items: { type: string }
        meaning_graph: { type: string }
        image: { type: string, nullable: true, description: Base64-encoded. }

    ProjectInput:
      type: object
      required: [name, sphere_id]
      properties:
        name: { type: string }
        sphere_id: { type: string, format: uuid }
        description: { type: string }
        values:
          type: array
          items: { type: string }
        image: { type: string, format: binary }

    Project:
      type: object
      properties:
        project_id: { type: string, format: uuid }
        id: { type: string, format: uuid, description: Alias of project_id. }
        name: { type: string }
        description: { type: string }
        owner: { type: string, format: uuid }
        owner_alliance: { type: string, format: uuid, nullable: true }
        status: { type: string }
        sphere_id: { type: string, format: uuid }
        sphere_name: { type: string }
        participants:
          type: array
          items: { type: string }
          description: Member display names.
        members:
          type: array
          items: { $ref: '#/components/schemas/MemberRef' }
        values:
          type: array
          items: { type: string }
        image: { type: string, nullable: true, description: Base64-encoded. }

    Opening:
      type: object
      properties:
        service_id: { type: string, format: uuid }
        id: { type: string, format: uuid, description: Alias of service_id. }
        type: { type: string, example: offer }
        title: { type: string }
        description: { type: string }
        provider: { type: string }
        provider_id: { type: string, format: uuid }
        sphere_id: { type: string, format: uuid, nullable: true }
        spheres:
          type: array
          items: { type: string }
        status: { type: string }
        values:
          type: array
          items: { type: string }
        likes: { type: integer }
        project_name: { type: string, nullable: true }
        image_key: { type: string, nullable: true }
        cadence: { type: string, enum: [single, perpetual] }
        accepted_by: { type: string, format: uuid, nullable: true }
        accepted_by_name: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        accepted_at: { type: string, format: date-time, nullable: true }
        in_progress_at: { type: string, format: date-time, nullable: true }
        completed_at: { type: string, format: date-time, nullable: true }
        image: { type: string, nullable: true, description: Base64-encoded. }
        acting_user_id: { type: string, format: uuid, nullable: true }
        acting_user: { type: string, nullable: true }

    OpeningEnriched:
      allOf:
        - $ref: '#/components/schemas/Opening'
        - type: object
          properties:
            liked_by_current_user: { type: boolean }
            pending_acceptances:
              type: array
              items: { $ref: '#/components/schemas/Acceptance' }
            my_acceptance:
              allOf:
                - $ref: '#/components/schemas/Acceptance'
              nullable: true
            activity:
              allOf:
                - $ref: '#/components/schemas/OpeningActivity'
              nullable: true
              description: Present only when cadence is "perpetual".

    Acceptance:
      type: object
      properties:
        accepter_id: { type: string, format: uuid }
        accepter_name: { type: string }
        status: { type: string }
        exchange_id: { type: string, format: uuid, nullable: true }
        created_at: { type: string, format: date-time }

    OpeningActivity:
      type: object
      properties:
        accepted_count: { type: integer }
        accepted_last_at: { type: string, format: date-time, nullable: true }
        in_progress_count: { type: integer }
        in_progress_last_at: { type: string, format: date-time, nullable: true }
        completed_last_at: { type: string, format: date-time, nullable: true }

    ValueCardInput:
      type: object
      required: [care_about]
      properties:
        title: { type: string }
        care_about: { type: string }
        because: { type: string }
        looks_like:
          type: array
          items: { type: string }
        drift_looks_like: { type: string }
        in_conflict: { type: string }
        never_do: { type: string }
        frankl_mode:
          type: string
          enum: [creative, experiential, attitudinal]
          default: creative
        color_key:
          type: string
          enum: [honey, leaf, terracotta, sage, moss]
          default: honey

    ValueCard:
      allOf:
        - $ref: '#/components/schemas/ValueCardInput'
        - type: object
          properties:
            card_id: { type: string, format: uuid }
            user_id:
              type: string
              format: uuid
              description: The owning user or entity id.
            created_at: { type: string, format: date-time }
            is_current:
              type: boolean
              description: False once this card has been superseded by an edit.
            replaces_card_id:
              type: string
              format: uuid
              nullable: true
              description: The card_id this version was edited from, if any.

    Notification:
      type: object
      properties:
        notification_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        actor_id: { type: string, format: uuid }
        actor_name: { type: string }
        type:
          type: string
          example: new_follower
        message: { type: string }
        link: { type: string }
        is_read: { type: boolean }
