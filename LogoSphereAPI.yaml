  # ─────────────────────────── Openings ───────────────────────────

  /api/openings:
    post:
      summary: Post an opening (offer or need)
      operationId: createOpening
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string }
                type: { type: string, example: offer }
                description: { type: string }
                sphere_id: { type: string, format: uuid }
                sphere_name: { type: string }
                values:
                  type: array
                  items: { type: string }
                project_name: { type: string }
                image_key: { type: string }
                cadence: { type: string, enum: [single, perpetual] }
                borrow: { type: boolean, description: "A loan: an offer to lend, or a need to borrow" }
                also_sphere_ids:
                  type: array
                  items: { type: string, format: uuid }
                  description: >-
                    Spheres to share it with beside its own. The caller must be in them, and demo spheres
                    and real ones don't mix.
                acting_as_id:
                  type: string
                  format: uuid
                  description: Post on behalf of a sphere/alliance/project the caller manages.
      responses:
        '201':
          description: Opening created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Opening' }
        '400':
          description: Title missing, or acting_as_id doesn't resolve to a known entity.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Not authorized to post on behalf of that entity.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          $ref: '#/components/responses/InternalError'
      tags: [Openings]
    get:
      summary: List openings
      description: >-
        Newest first. Filters out non-perpetual openings that are already in
        progress or completed, and openings scoped to a sphere the caller
        isn't a member of, unless shared with one they are in. `borrow` marks a
        loan. `shared_with` names the spheres it's shared with that the caller
        is in (all, for who runs it). To someone outside its own sphere it
        doesn't name that sphere's people: who liked or took it up, history.
      operationId: listOpenings
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/OpeningEnriched' }
        '500':
          $ref: '#/components/responses/InternalError'
      tags: [Openings]

  /api/openings/{service_id}:
    patch:
      summary: "Edit an opening (its provider); once it has exchanges the edit becomes a new version"
      operationId: editOpening
      tags: [Openings]
      parameters:
        - { name: service_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: OK }
        '401': { description: 'No session, or it expired.' }
        '500': { $ref: '#/components/responses/InternalError' }
    get:
      summary: Get a single opening
      operationId: getOpening
      parameters:
        - $ref: '#/components/parameters/ServiceId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OpeningEnriched'
                  - type: object
                    properties:
                      exchanges:
                        type: array
                        items: { $ref: '#/components/schemas/MeaningTrailEntry' }
        '400':
          description: Invalid opening id.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Not authorized to view this opening.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Opening not found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          $ref: '#/components/responses/InternalError'
      tags: [Openings]

  /api/openings/{service_id}/accept:
    post:
      summary: Accept an opening
      description: Creates a pending acceptance; the provider must confirm it to create the exchange.
      operationId: acceptOpening
      parameters:
        - $ref: '#/components/parameters/ServiceId'
      responses:
        '200':
          description: Acceptance recorded (or already existed).
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  status: { type: string, example: pending }
                  acceptance: { type: object }
        '400':
          description: Cannot accept your own opening, or invalid opening id.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Opening or user not found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Opening is no longer open, or already accepted by this caller.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          $ref: '#/components/responses/InternalError'
      tags: [Openings]

  /api/openings/{service_id}/confirm:
    post:
      summary: Confirm an acceptance, creating the exchange
      operationId: confirmOpeningAcceptance
      parameters:
        - $ref: '#/components/parameters/ServiceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [accepter_id]
              properties:
                accepter_id: { type: string, format: uuid }
      responses:
        '200':
          description: Exchange created (or was already confirmed).
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  exchange_id: { type: string, format: uuid }
        '400':
          description: accepter_id missing or invalid.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Only the provider can confirm acceptances.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Opening or acceptance not found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          $ref: '#/components/responses/InternalError'
      tags: [Openings]

  /api/openings/{service_id}/reject:
    post:
      summary: Decline a pending acceptance, or take your own back
      description: >-
        The provider (or a platform admin) declines someone's pending
        acceptance; the accepting side - the person, the human who accepted
        for a group, or that group's managers - may take its own back. A
        one-time opening reopens to others.
      operationId: rejectOpeningAcceptance
      parameters:
        - $ref: '#/components/parameters/ServiceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [accepter_id]
              properties:
                accepter_id: { type: string, format: uuid }
      responses:
        '200':
          description: Acceptance declined (or taken back).
          content:
            application/json:
              schema:
                type: object
                properties: { message: { type: string, example: Acceptance declined } }
        '400':
          description: accepter_id missing or invalid.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Neither the provider nor the accepting side.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Opening or acceptance not found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: This acceptance is already confirmed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          $ref: '#/components/responses/InternalError'
      tags: [Openings]

  /api/openings/{service_id}/like:
    post:
      summary: Toggle a like on an opening
      operationId: toggleOpeningLike
      parameters:
