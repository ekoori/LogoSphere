  # ─────────────────────────── Openings ───────────────────────────

  /api/openings:
    post:
      summary: Post an opening (offer or need)
      operationId: createOpening
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string }
                type: { type: string, example: offer }
                description: { type: string }
                sphere_id: { type: string, format: uuid }
                sphere_name: { type: string }
                values:
                  type: array
                  items: { type: string }
                project_name: { type: string }
                image_key: { type: string }
                cadence: { type: string, enum: [single, perpetual] }
                acting_as_id:
                  type: string
                  format: uuid
                  description: Post on behalf of a sphere/alliance/project the caller manages.
      responses:
        '201':
          description: Opening created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Opening' }
        '400':
          description: Title missing, or acting_as_id doesn't resolve to a known entity.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Not authorized to post on behalf of that entity.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          $ref: '#/components/responses/InternalError'
      tags: [Openings]
    get:
      summary: List openings
      description: >-
        Filters out non-perpetual openings that are already in progress or
        completed, and openings scoped to a sphere the caller isn't a member
        of.
      operationId: listOpenings
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/OpeningEnriched' }
        '500':
          $ref: '#/components/responses/InternalError'
      tags: [Openings]

  /api/openings/{service_id}:
    get:
      summary: Get a single opening
      operationId: getOpening
      parameters:
        - $ref: '#/components/parameters/ServiceId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/OpeningEnriched'
                  - type: object
                    properties:
                      exchanges:
                        type: array
                        items: { $ref: '#/components/schemas/MeaningTrailEntry' }
        '400':
          description: Invalid opening id.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Not authorized to view this opening.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Opening not found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          $ref: '#/components/responses/InternalError'
      tags: [Openings]

  /api/openings/{service_id}/accept:
    post:
      summary: Accept an opening
      description: Creates a pending acceptance; the provider must confirm it to create the exchange.
      operationId: acceptOpening
      parameters:
        - $ref: '#/components/parameters/ServiceId'
      responses:
        '200':
          description: Acceptance recorded (or already existed).
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  status: { type: string, example: pending }
                  acceptance: { type: object }
        '400':
          description: Cannot accept your own opening, or invalid opening id.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Opening or user not found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Opening is no longer open, or already accepted by this caller.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          $ref: '#/components/responses/InternalError'
      tags: [Openings]

  /api/openings/{service_id}/confirm:
    post:
      summary: Confirm an acceptance, creating the exchange
      operationId: confirmOpeningAcceptance
      parameters:
        - $ref: '#/components/parameters/ServiceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [accepter_id]
              properties:
                accepter_id: { type: string, format: uuid }
      responses:
        '200':
          description: Exchange created (or was already confirmed).
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  exchange_id: { type: string, format: uuid }
        '400':
          description: accepter_id missing or invalid.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Only the provider can confirm acceptances.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Opening or acceptance not found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          $ref: '#/components/responses/InternalError'
      tags: [Openings]

  /api/openings/{service_id}/reject:
    post:
      summary: Reject a pending acceptance
      operationId: rejectOpeningAcceptance
      parameters:
        - $ref: '#/components/parameters/ServiceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [accepter_id]
              properties:
                accepter_id: { type: string, format: uuid }
      responses:
        '200':
          description: Acceptance declined.
          content:
            application/json:
              schema:
                type: object
                properties: { message: { type: string, example: Acceptance declined } }
        '400':
          description: accepter_id missing or invalid.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Only the provider can reject acceptances.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Opening or acceptance not found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: This acceptance is already confirmed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          $ref: '#/components/responses/InternalError'
      tags: [Openings]

  /api/openings/{service_id}/like:
    post:
      summary: Toggle a like on an opening
      operationId: toggleOpeningLike
      parameters:
        - $ref: '#/components/parameters/ServiceId'
      responses:
        '200':
          description: New like state and count.
          content:
            application/json:
              schema:
                type: object
                properties:
                  liked: { type: boolean }
                  likes: { type: integer }
        '400':
          description: Invalid opening id.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Opening not found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          $ref: '#/components/responses/InternalError'
      tags: [Openings]

  /api/openings/{service_id}/image:
    post:
      summary: Update an opening's image
      operationId: updateOpeningImage
      parameters:
        - $ref: '#/components/parameters/ServiceId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties: { image: { type: string, format: binary } }
      responses:
        '200':
          description: Image updated.
          content:
            application/json:
              schema:
                type: object
                properties: { message: { type: string, example: Image updated } }
        '400':
          description: Missing file, unsupported format, or invalid opening id.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Not authorized to manage this opening.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Opening not found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          $ref: '#/components/responses/InternalError'
      tags: [Openings]

  # ─────────────────────────── Value Cards ───────────────────────────

  /api/value_cards/{target_user_id}:
    get:
      summary: List a user's or entity's current value cards
      description: Public — no session required. Only returns the current (non-superseded) version of each card; edits are versioned, not overwritten in place.
      operationId: listValueCards
      security: []
      parameters:
        - name: target_user_id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: A user id, or an entity id (sphere/alliance/project) for its own value cards.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ValueCard' }
        '500':
          $ref: '#/components/responses/InternalError'
      tags: [Value Cards]

  /api/value_cards:
    post:
      summary: Create a value card for the logged-in user
      operationId: createValueCard
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ValueCardInput' }
      responses:
        '201':
          description: Card created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValueCard' }
        '400':
          description: No data provided, or care_about is missing.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          $ref: '#/components/responses/InternalError'
      tags: [Value Cards]

  /api/value_cards/{card_id}:
    patch:
      summary: Edit a value card (versioned)
      description: >-
        Only the card's owner may edit it. The edit is never written in
        place: the server creates a new card with the merged fields
        (`replaces_card_id` pointing at the old card) and flips the old
        card's `is_current` to false. The old row's content is never
        mutated, so anything that already captured it (e.g. a meaning-trail
        receipt snapshot) is unaffected — full edit history survives in
        Cassandra even though only the current version is returned by
        `GET /api/value_cards/{target_user_id}`.
      operationId: editValueCard
      parameters:
        - $ref: '#/components/parameters/CardId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ValueCardInput' }
      responses:
        '200':
          description: The new current version of the card.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValueCard' }
        '400':
          description: No data provided.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: No card with that id exists for the caller.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          $ref: '#/components/responses/InternalError'
      tags: [Value Cards]
    delete:
      summary: Delete a value card
      description: Deletes only within the caller's own partition — a card_id belonging to someone else is silently a no-op.
      operationId: deleteValueCard
      parameters:
        - $ref: '#/components/parameters/CardId'
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                properties: { message: { type: string, example: deleted } }
        '500':
          $ref: '#/components/responses/InternalError'
      tags: [Value Cards]

  /api/value_cards/clone:
    post:
      summary: Clone a value card onto your own or a managed entity's Meaning Graph
      description: >-
        The client sends the full source card's field values (it already has
        them, from rendering the card) rather than a bare id — value_cards is
        keyed by (owner_id, card_id), so a card_id alone can't be looked up
        without an inefficient scan. The clone becomes a brand-new,
        independent card; it is never linked back to its source.
      operationId: cloneValueCard
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source, target_id]
              properties:
                source: { $ref: '#/components/schemas/ValueCardInput' }
                target_id:
                  type: string
                  format: uuid
                  description: The caller's own id, or an entity id the caller manages.
      responses:
        '201':
          description: New card created for the target.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValueCard' }
        '400':
          description: target_id missing, or the source card has no care_about.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Not authorized to add a value card to that target.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          $ref: '#/components/responses/InternalError'
      tags: [Value Cards]

  /api/entity_value_cards/{entity_id}:
    post:
      summary: Create a value card owned by an entity
      description: Caller must manage the sphere/alliance/project (see `can_manage_entity`).
      operationId: createEntityValueCard
      parameters:
        - $ref: '#/components/parameters/EntityId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ValueCardInput' }
      responses:
        '201':
          description: Card created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValueCard' }
        '400':
          description: No data provided, or care_about is missing.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Not authorized to manage this entity.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          $ref: '#/components/responses/InternalError'
      tags: [Value Cards]

  /api/entity_value_cards/{entity_id}/{card_id}:
    patch:
      summary: Edit an entity's value card (versioned)
      description: Same versioning behavior as `PATCH /api/value_cards/{card_id}`, scoped to an entity the caller manages.
      operationId: editEntityValueCard
      parameters:
        - $ref: '#/components/parameters/EntityId'
        - $ref: '#/components/parameters/CardId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ValueCardInput' }
      responses:
        '200':
          description: The new current version of the card.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValueCard' }
        '400':
          description: No data provided.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Not authorized to manage this entity.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: No card with that id exists for this entity.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          $ref: '#/components/responses/InternalError'
      tags: [Value Cards]
    delete:
      summary: Delete an entity's value card
      operationId: deleteEntityValueCard
      parameters:
        - $ref: '#/components/parameters/EntityId'
        - $ref: '#/components/parameters/CardId'
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                properties: { message: { type: string, example: deleted } }
        '403':
          description: Not authorized to manage this entity.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          $ref: '#/components/responses/InternalError'
      tags: [Value Cards]

  # ─────────────────────────── Notifications ───────────────────────────

  /api/notifications:
    get:
      summary: List the logged-in user's notifications
      operationId: listNotifications
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  notifications:
                    type: array
                    items: { $ref: '#/components/schemas/Notification' }
                  unread_count: { type: integer }
        '500':
          $ref: '#/components/responses/InternalError'
      tags: [Notifications]

  /api/notifications/read:
    post:
      summary: Mark one notification as read
      operationId: markNotificationRead
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [created_at, notification_id]
              properties:
                created_at: { type: string, format: date-time }
                notification_id: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties: { message: { type: string, example: ok } }
        '400':
          description: created_at/notification_id missing, or created_at isn't a valid timestamp.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          $ref: '#/components/responses/InternalError'
      tags: [Notifications]

  /api/notifications/read_all:
    post:
      summary: Mark all notifications as read
      operationId: markAllNotificationsRead
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties: { message: { type: string, example: ok } }
        '500':
          $ref: '#/components/responses/InternalError'
      tags: [Notifications]

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >-
        `Authorization: Bearer <session_id>`, where `session_id` is the token
        returned by `POST /api/login`. See the top-level Authentication
        section for the full model (server-stored sessions; cookie transport
        for the reference web client). Applies to every endpoint except
        `/api/login`, `/api/register`, `/api/check_session`, and the public
        image/GET endpoints, which are marked `security: []` individually.

  parameters:
    TargetId:
      name: target_id
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: The id of the user being acted on.
    ProjectId:
      name: project_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ExchangeId:
      name: exchange_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    SphereId:
      name: sphere_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    AllianceId:
      name: alliance_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ServiceId:
      name: service_id
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: An opening's id.
    CardId:
      name: card_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    EntityId:
      name: entity_id
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: A sphere, alliance, or project id.

  responses:
    InternalError:
      description: Unexpected server-side failure.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      properties:
        message: { type: string }
      description: >-
        The standard error body. A few auth endpoints (`/api/login`,
        `/api/logout`, `/api/check_session`) predate this convention and use
        `{"error": string}` with the same meaning instead.

    User:
      type: object
      properties:
        user_id: { type: string, format: uuid }
        email: { type: string, format: email }
        name: { type: string }
        surname: { type: string }
        location: { type: string }
        profile_picture:
          type: string
          nullable: true
          description: Base64-encoded image, or null if the user has no photo.
        session_id:
          type: string
          description: Present only on login/check-session responses.

    SessionStatus:
      type: object
      properties:
        status: { type: string, enum: [active, inactive] }
        user_id: { type: string, format: uuid, nullable: true }
        user_data:
          allOf:
            - $ref: '#/components/schemas/User'
          description: Present only when status is "active".

    MeaningTrailEntry:
      type: object
      description: One exchange, enriched with the viewer's perspective and per-comment like counts.
      properties:
        user_id: { type: string, format: uuid }
        exchange_id: { type: string, format: uuid }
        other_user_id: { type: string, format: uuid }
        other_user_name: { type: string }
        exchange_description: { type: string }
        exchange_long_description: { type: string }
        exchange_status:
          type: string
          enum: [Initiated, In Progress, Finished, Receipted, Additional Comments Added, Cancelled]
        project_id: { type: string, format: uuid, nullable: true }
        project_name: { type: string, nullable: true }
        project_start_timestamp: { type: string, format: date-time, nullable: true }
        gratitude_comment: { type: string, nullable: true }
        gratitude_comment_id: { type: string, format: uuid, nullable: true }
        gratitude_comment_timestamp: { type: string, format: date-time, nullable: true }
        gratitude_comment_context: { type: string, nullable: true }
        gratitude_comment_cards:
          type: array
          items: { $ref: '#/components/schemas/ValueCard' }
        user_comment: { type: string, nullable: true }
        user_comment_id: { type: string, format: uuid, nullable: true }
        user_comment_timestamp: { type: string, format: date-time, nullable: true }
        user_comment_cards:
          type: array
          items: { $ref: '#/components/schemas/ValueCard' }
        other_comment: { type: string, nullable: true }
        other_comment_id: { type: string, format: uuid, nullable: true }
        other_comment_author_id: { type: string, format: uuid, nullable: true }
        other_comment_author_name: { type: string, nullable: true }
        other_comment_timestamp: { type: string, format: date-time, nullable: true }
        other_comment_cards:
          type: array
          items: { $ref: '#/components/schemas/ValueCard' }
        initiator_comment: { type: string, nullable: true }
        initiator_comment_timestamp: { type: string, format: date-time, nullable: true }
        recipient_comment: { type: string, nullable: true }
        recipient_comment_timestamp: { type: string, format: date-time, nullable: true }
        initiator_acting_user_id:
          type: string
          format: uuid
          nullable: true
          description: Set when the initiator posted this exchange on behalf of an entity they manage.
        initiator_acting_user_name: { type: string, nullable: true }
        has_image: { type: boolean }
        likes:
          type: object
          additionalProperties:
            type: object
            properties:
              count: { type: integer }
              liked: { type: boolean }
        initiator_id: { type: string, format: uuid }
        initiator_name: { type: string }
        viewer_is_initiator: { type: boolean }

    SphereInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: string }
        meaning_graph: { type: string }
        location: { type: string }
        image: { type: string, format: binary }

    Sphere:
      type: object
      properties:
        sphere_id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        meaning_graph: { type: string }
        location: { type: string }
        image: { type: string, nullable: true, description: Base64-encoded. }
        admin1: { type: string, format: uuid }
        participants:
          type: array
          items: { type: string, format: uuid }
        participant_names:
          type: array
          items: { type: string }
        members:
          type: array
          items: { $ref: '#/components/schemas/MemberRef' }
        alliances:
          type: array
          items: { type: string, format: uuid }
        projects:
          type: array
          items: { type: string, format: uuid }
        values:
          type: array
          items: { type: string }

    MemberRef:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        role: { type: string }

    AllianceInput:
      type: object
      required: [name, sphere_id]
      properties:
        name: { type: string }
        sphere_id: { type: string, format: uuid }
        description: { type: string }
        meaning_graph: { type: string }
        values:
          type: array
          items: { type: string }
        projects:
          type: array
          items: { type: string, format: uuid }
        image: { type: string, format: binary }

    Alliance:
      type: object
      properties:
        alliance_id: { type: string, format: uuid }
        id: { type: string, format: uuid, description: Alias of alliance_id. }
        name: { type: string }
        description: { type: string }
        admin1: { type: string, format: uuid }
        sphere_id: { type: string, format: uuid }
        sphere_name: { type: string }
        participants:
          type: array
          items: { type: string }
          description: Member display names.
        members:
          type: array
          items: { $ref: '#/components/schemas/MemberRef' }
        projects:
          type: array
          items: { type: string, format: uuid }
        values:
          type: array
          items: { type: string }
        meaning_graph: { type: string }
        image: { type: string, nullable: true, description: Base64-encoded. }

    ProjectInput:
      type: object
      required: [name, sphere_id]
      properties:
        name: { type: string }
        sphere_id: { type: string, format: uuid }
        description: { type: string }
        values:
          type: array
          items: { type: string }
        image: { type: string, format: binary }

    Project:
      type: object
      properties:
        project_id: { type: string, format: uuid }
        id: { type: string, format: uuid, description: Alias of project_id. }
        name: { type: string }
        description: { type: string }
        owner: { type: string, format: uuid }
        owner_alliance: { type: string, format: uuid, nullable: true }
        status: { type: string }
        sphere_id: { type: string, format: uuid }
        sphere_name: { type: string }
        participants:
          type: array
          items: { type: string }
          description: Member display names.
        members:
          type: array
          items: { $ref: '#/components/schemas/MemberRef' }
        values:
          type: array
          items: { type: string }
        image: { type: string, nullable: true, description: Base64-encoded. }

    Opening:
      type: object
      properties:
        service_id: { type: string, format: uuid }
        id: { type: string, format: uuid, description: Alias of service_id. }
        type: { type: string, example: offer }
        title: { type: string }
        description: { type: string }
        provider: { type: string }
        provider_id: { type: string, format: uuid }
        sphere_id: { type: string, format: uuid, nullable: true }
        spheres:
          type: array
          items: { type: string }
        status: { type: string }
        values:
          type: array
          items: { type: string }
        likes: { type: integer }
        project_name: { type: string, nullable: true }
        image_key: { type: string, nullable: true }
        cadence: { type: string, enum: [single, perpetual] }
        accepted_by: { type: string, format: uuid, nullable: true }
        accepted_by_name: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        accepted_at: { type: string, format: date-time, nullable: true }
        in_progress_at: { type: string, format: date-time, nullable: true }
        completed_at: { type: string, format: date-time, nullable: true }
        image: { type: string, nullable: true, description: Base64-encoded. }
        acting_user_id: { type: string, format: uuid, nullable: true }
        acting_user: { type: string, nullable: true }

    OpeningEnriched:
      allOf:
        - $ref: '#/components/schemas/Opening'
        - type: object
          properties:
            liked_by_current_user: { type: boolean }
            pending_acceptances:
              type: array
              items: { $ref: '#/components/schemas/Acceptance' }
            my_acceptance:
              allOf:
                - $ref: '#/components/schemas/Acceptance'
              nullable: true
            activity:
              allOf:
                - $ref: '#/components/schemas/OpeningActivity'
              nullable: true
              description: Present only when cadence is "perpetual".

    Acceptance:
      type: object
      properties:
        accepter_id: { type: string, format: uuid }
        accepter_name: { type: string }
        status: { type: string }
        exchange_id: { type: string, format: uuid, nullable: true }
        created_at: { type: string, format: date-time }

    OpeningActivity:
      type: object
      properties:
        accepted_count: { type: integer }
        accepted_last_at: { type: string, format: date-time, nullable: true }
        in_progress_count: { type: integer }
        in_progress_last_at: { type: string, format: date-time, nullable: true }
        completed_last_at: { type: string, format: date-time, nullable: true }

    ValueCardInput:
      type: object
      required: [care_about]
      properties:
        title: { type: string }
        care_about: { type: string }
        because: { type: string }
        looks_like:
          type: array
          items: { type: string }
        drift_looks_like: { type: string }
        in_conflict: { type: string }
        never_do: { type: string }
        frankl_mode:
          type: string
          enum: [creative, experiential, attitudinal]
          default: creative
        color_key:
          type: string
          enum: [honey, leaf, terracotta, sage, moss]
          default: honey

    ValueCard:
      allOf:
        - $ref: '#/components/schemas/ValueCardInput'
        - type: object
          properties:
            card_id: { type: string, format: uuid }
            user_id:
              type: string
              format: uuid
              description: The owning user or entity id.
            created_at: { type: string, format: date-time }
            is_current:
              type: boolean
              description: False once this card has been superseded by an edit.
            replaces_card_id:
              type: string
              format: uuid
              nullable: true
              description: The card_id this version was edited from, if any.

    Notification:
      type: object
      properties:
        notification_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        actor_id: { type: string, format: uuid }
        actor_name: { type: string }
        type:
          type: string
          example: new_follower
        message: { type: string }
        link: { type: string }
        is_read: { type: boolean }
