openapi: 3.0.0
info:
  title: LogoSphere API
  description: |
    API for the LogoSphere gift-economy / trust platform: spheres, alliances,
    projects, openings (offers/needs), exchanges, value cards (Meaning Graph),
    and notifications.

    This document describes the API surface as it actually exists in
    `backend/app/main.py` and its route modules — every path, method, and
    schema below is backed by a real Flask handler. It is not a design sketch.

    ## Authentication

    Sessions are **server-stored** (a Cassandra-backed `sessions` table keyed
    by an opaque random `session_id`, 30-day TTL, instantly revoked on
    `/api/logout`) — not a stateless JWT. This is a deliberate choice: it
    gives immediate, no-blacklist-required revocation, and avoids managing a
    signing-key rotation policy for a token type we'd still need a DB-backed
    denylist for anyway to support logout.

    `POST /api/login` returns the session token as `session_id` in the JSON
    body. Send it back on every subsequent request as a standard bearer
    credential:

    ```
    Authorization: Bearer <session_id>
    ```

    Tokens are **never** accepted via query parameter — query strings end up
    in server logs, proxy logs, and browser history, so that transport is
    intentionally unsupported.

    The reference web client (the LogoSphere React app) additionally receives
    the same token as an `httpOnly`, `Secure`, `SameSite=Lax` cookie set on
    login, and authenticates with that cookie instead of the header. This is
    not a second, inconsistent mechanism — both resolve to the same
    server-stored session row — it's simply a stronger transport for a
    same-origin browser client: an `httpOnly` cookie can't be read by injected
    script, whereas a JS-readable `Authorization` header value would have to
    live in `localStorage`/`sessionStorage` and become an XSS exfiltration
    target. Non-browser clients (scripts, tests, mobile apps, integrations)
    should use the `Authorization: Bearer` header documented here.

    ## Errors

    Every endpoint that can fail returns a JSON body of shape
    `{"message": string}` (a few auth endpoints predate this convention and
    use `{"error": string}` instead — noted on those operations). A `500`
    always means an unexpected server-side failure, not a validation error.
  version: 2.0.0

servers:
  - url: "https://ts.krbavcic.com"
    description: LogoSphere production server

security:
  - bearerAuth: []

tags:
  - name: Authentication
  - name: User Management
  - name: Meaning Trail
  - name: Exchanges
  - name: Spheres
  - name: Alliances
  - name: Projects
  - name: Openings
  - name: Value Cards
  - name: Notifications
  - name: Governance
  - name: Search
  - name: Administration

paths:

  # ─────────────────────────── Authentication ───────────────────────────

  /api/login:
    post:
      summary: Log in
      description: Authenticates a user and returns a session token.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  description: >-
                    Plaintext password, sent once over TLS. The server hashes
                    it (PBKDF2, via werkzeug) before ever touching storage;
                    the client does not pre-hash it. Never logged, echoed
                    back, or included in any response.
      responses:
        '200':
          description: Login successful. Also sets an httpOnly `session_id` cookie.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Login successful
                  session_id:
                    type: string
                    description: >-
                      Server-stored session token. Send it on subsequent
                      requests as `Authorization: Bearer <session_id>`. (The
                      reference web client instead uses the httpOnly cookie
                      also set on this response.)
                  data:
                    $ref: '#/components/schemas/User'
        '401':
          description: Invalid email or password.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          $ref: '#/components/responses/InternalError'
      tags: [Authentication]

  /api/logout:
    post:
      summary: Log out
      description: >-
        Deletes the server-stored session row (so the token in
        `Authorization: Bearer` or the cookie becomes invalid immediately)
        and clears the session cookie for browser clients.
      operationId: logout
      responses:
        '200':
          description: Logout successful.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
        '400':
          description: No valid session token was present to log out.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          $ref: '#/components/responses/InternalError'
      tags: [Authentication]

  /api/check_session:
    get:
      summary: Check session (idempotent)
      description: Reports whether the caller's session is currently valid.
      operationId: checkSession
      security: []
      responses:
        '200':
          description: >-
            Always 200 — the body's `status` field distinguishes active from
            inactive/expired/missing sessions.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionStatus' }
        '500':
          $ref: '#/components/responses/InternalError'
      tags: [Authentication]
    post:
      summary: Check session
      description: Identical behavior to `GET /api/check_session`; accepted for legacy clients.
      operationId: checkSessionPost
      security: []
      responses:
        '200':
          description: Always 200 — see `GET /api/check_session`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionStatus' }
        '500':
          $ref: '#/components/responses/InternalError'
      tags: [Authentication]

  /api/register:
    post:
      summary: Register a new user
      operationId: registerUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name: { type: string }
                email: { type: string, format: email }
                password:
                  type: string
                  minLength: 8
                  description: >-
                    Plaintext password, sent once over TLS; the server hashes
                    it before storage. Minimum 8 characters. Never logged or
                    returned in any response.
      responses:
        '200':
          description: Registration successful.
          content:
            application/json:
              schema:
                type: object
                properties:
                  reg_success: { type: boolean, example: true }
                  message: { type: string }
                  user_id: { type: string, format: uuid }
        '400':
          description: >-
            Missing fields, invalid email, password under 8 characters, or
            the email is already registered — all collapse to the same
            message/status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
      tags: [Authentication]

  # ─────────────────────────── User Management ───────────────────────────

  /api/user:
    get:
      summary: Get the logged-in user's basic identity
      operationId: getCurrentUser
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_id: { type: string, format: uuid }
                  email: { type: string, format: email }
                  name: { type: string }
        '404':
          description: User not found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          $ref: '#/components/responses/InternalError'
      tags: [User Management]

  /api/user/profile:
    get:
      summary: Get the logged-in user's full profile
      operationId: getCurrentUserProfile
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '404':
          description: User not found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          $ref: '#/components/responses/InternalError'
      tags: [User Management]

  /api/users/{target_id}:
    get:
      summary: Get a user's public profile
      operationId: getPublicUser
      parameters:
        - $ref: '#/components/parameters/TargetId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/User'
                  - type: object
                    properties:
                      is_following:
                        type: boolean
                        description: Whether the caller follows this user (always false for one's own id).
                      following_count:
                        type: integer
        '404':
          description: User not found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          $ref: '#/components/responses/InternalError'
      tags: [User Management]

  /api/users/{target_id}/avatar:
    get:
      summary: Get a user's avatar image
      description: >-
        Public, no session required, cacheable. Returns the uploaded photo,
        or a generated initials SVG (still HTTP 200) if the user has none —
        so `<img>` tags never produce a 404.
      operationId: getUserAvatar
      security: []
      parameters:
        - $ref: '#/components/parameters/TargetId'
      responses:
        '200':
          description: Image bytes (`image/png`, `image/gif`, `image/webp`, `image/jpeg`, or `image/svg+xml`).
          content:
            image/*: { schema: { type: string, format: binary } }
      tags: [User Management]

  /api/users/{target_id}/follow:
    post:
      summary: Toggle following a user
      description: Follows the target user if not already followed, otherwise unfollows. Fires a `new_follower` notification on follow.
      operationId: toggleFollow
      parameters:
        - $ref: '#/components/parameters/TargetId'
      responses:
        '200':
          description: New follow state.
          content:
            application/json:
              schema:
                type: object
                properties:
                  following: { type: boolean }
        '400':
          description: Cannot follow yourself, or an invalid user id.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          $ref: '#/components/responses/InternalError'
      tags: [User Management]

  /api/following:
    get:
      summary: List who the logged-in user follows
      operationId: getFollowing
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string, format: uuid }
                    name: { type: string }
        '500':
          $ref: '#/components/responses/InternalError'
      tags: [User Management]

  /api/updateuser:
    post:
      summary: Update the logged-in user's profile
      operationId: updateCurrentUser
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                name: { type: string }
                surname: { type: string }
                location: { type: string }
                profile_picture: { type: string, format: binary }
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                surname: { type: string }
                location: { type: string }
      responses:
        '200':
          description: Updated profile.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400':
          description: No data provided, or an unsupported image format was uploaded.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          $ref: '#/components/responses/InternalError'
      tags: [User Management]

  # ─────────────────────────── Meaning Trail ───────────────────────────

  /api/account/password:
    post:
      summary: Change your password
      description: >-
        Needs the current password. Every other session of yours ends; this one
        stays signed in.
      operationId: changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string }
                new_password: { type: string, minLength: 8 }
      responses:
        '200':
          description: Changed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  signed_out: { type: integer, description: How many other sessions ended }
        '400':
          description: The new password is too short, or the same as the old one.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: The current password is wrong.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
      tags: [User Management]

  /api/account/export:
    get:
      summary: Download everything LogoSphere holds about you
      description: >-
        A JSON file (Content-Disposition attachment): profile, value cards,
        memberships, openings, exchanges, follows, governance votes and
        proposals, notifications. Never the password hash or session tokens;
        pictures are flagged, not embedded.
      operationId: exportAccount
      responses:
        '200':
          description: The file.
          content:
            application/json:
              schema: { type: object }
        '401':
          description: No session, or it expired.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
      tags: [User Management]

  /api/account/delete:
    post:
      summary: Delete your account
      description: >-
        Needs your password. Removes your profile, credentials, sessions, value
        cards, notifications, follows and memberships and withdraws your
        openings; exchanges stay as history under your name. The last platform
        administrator can't delete their account.
      operationId: deleteAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string }
      responses:
        '200':
          description: Deleted; the session cookie is cleared.
          content:
            application/json:
              schema: { type: object, properties: { message: { type: string } } }
        '400':
          description: The only platform administrator.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Wrong password.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
      tags: [User Management]

  /api/password/reset:
    post:
      summary: Set a new password with a reset link
      description: >-
        Redeems a one-time token from a reset link a platform administrator
        issued (POST /api/admin/users/{target_id}/reset_link). Works once,
        within 24 hours; every session of the member ends. No sign-in needed.
      operationId: resetPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string }
                password: { type: string, minLength: 8 }
      responses:
        '200':
          description: Changed.
          content:
            application/json:
              schema: { type: object, properties: { message: { type: string } } }
        '400':
          description: The link expired or was used, or the password is too short.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
      tags: [Authentication]

  /api/meaning_trail:
    get:
      summary: Get a user's meaning trail (exchange history)
      description: Defaults to the logged-in user; use the POST form to view someone else's.
      operationId: getMeaningTrail
      responses:
        '200':
          description: Exchanges the user has participated in, most recent first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MeaningTrailEntry' }
        '404':
          description: Meaning trail could not be fetched.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
      tags: [Meaning Trail]
    post:
      summary: Get another user's meaning trail
      operationId: getMeaningTrailForUser
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id: { type: string, format: uuid }
      responses:
        '200':
          description: Exchanges the given user has participated in, most recent first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MeaningTrailEntry' }
        '404':
          description: Meaning trail could not be fetched.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
      tags: [Meaning Trail]

  /api/meaning_trail/by_project/{project_id}:
    get:
      summary: Get all exchanges tied to a project
      operationId: getMeaningTrailByProject
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MeaningTrailEntry' }
      tags: [Meaning Trail]

  # ─────────────────────────── Exchanges ───────────────────────────

  /api/exchange/{exchange_id}:
    get:
      summary: Get a single exchange
      operationId: getExchange
      parameters:
        - $ref: '#/components/parameters/ExchangeId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  exchange:
                    allOf:
                      - $ref: '#/components/schemas/MeaningTrailEntry'
                      - type: object
                        properties:
                          receipt_photo_count: { type: integer }
                          is_finished: { type: boolean }
                  is_initiator: { type: boolean }
                  is_other: { type: boolean }
                  is_participant: { type: boolean }
        '404':
          description: Exchange not found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          $ref: '#/components/responses/InternalError'
      tags: [Exchanges]

  /api/exchange/{exchange_id}/status:
    post:
      summary: Update an exchange's status
      operationId: updateExchangeStatus
      parameters:
        - $ref: '#/components/parameters/ExchangeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [Initiated, In Progress, Finished, Receipted, Additional Comments Added, Cancelled]
      responses:
        '200':
          description: Status updated.
          content:
            application/json:
              schema:
                type: object
                properties: { message: { type: string, example: Status updated } }
        '400':
          description: Invalid status value.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Only participants can change the status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Exchange not found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          $ref: '#/components/responses/InternalError'
      tags: [Exchanges]

  /api/exchange/{exchange_id}/comment:
    post:
      summary: Add a receipt, gratitude note, or comment to an exchange
      description: >-
        `type: gratitude` is the recipient's receipt; `type: user` is the
        initiator's personal note; `type: other`/`comment` are open
        follow-up comments. Each side may only add its receipt/note once.
        Value cards attached here (`cards`) are stored as a point-in-time
        JSON snapshot — later edits to those cards do not change what's
        shown on this comment.
      operationId: addExchangeComment
      parameters:
        - $ref: '#/components/parameters/ExchangeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, text]
              properties:
                type:
                  type: string
                  enum: [gratitude, user, other, comment]
                text:
                  type: string
                cards:
                  type: array
                  items: { $ref: '#/components/schemas/ValueCard' }
                context:
                  type: string
                  description: Structured context text, gratitude comments only.
      responses:
        '200':
          description: Comment added.
          content:
            application/json:
              schema:
                type: object
                properties: { message: { type: string, example: Comment added } }
        '400':
          description: Invalid comment data (missing type/text).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: >-
            Not authorized for this comment type on this exchange (e.g. only
            the recipient can add a receipt).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Exchange not found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: >-
            Sequencing conflict — e.g. both sides must receipt first, or this
            side has already commented.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          $ref: '#/components/responses/InternalError'
      tags: [Exchanges]

  /api/exchange/{exchange_id}/like:
    post:
      summary: Toggle a like on an exchange or one of its comments
      operationId: toggleExchangeLike
      parameters:
        - $ref: '#/components/parameters/ExchangeId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                comment_type:
                  type: string
                  enum: [exchange, gratitude, user, other]
                  default: exchange
      responses:
        '200':
          description: New like state and count.
          content:
            application/json:
              schema:
                type: object
                properties:
                  liked: { type: boolean }
                  count: { type: integer }
                  comment_type: { type: string }
        '400':
          description: Invalid comment_type.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Exchange not found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          $ref: '#/components/responses/InternalError'
      tags: [Exchanges]

  /api/exchange/{exchange_id}/edit:
    post:
      summary: Edit an exchange's title, description, or image
      description: Only participants may edit, and only until the exchange is finished.
      operationId: editExchange
      parameters:
        - $ref: '#/components/parameters/ExchangeId'
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                title: { type: string }
                description: { type: string }
                image: { type: string, format: binary }
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                description: { type: string }
      responses:
        '200':
          description: Exchange updated.
          content:
            application/json:
              schema:
                type: object
                properties: { message: { type: string, example: Exchange updated } }
        '400':
          description: Unsupported image format.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Only participants can edit this exchange.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Exchange not found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: This exchange is finished and can no longer be changed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          $ref: '#/components/responses/InternalError'
      tags: [Exchanges]

  /api/exchange/{exchange_id}/image:
    get:
      summary: Get an exchange's image
      operationId: getExchangeImage
      security: []
      parameters:
        - $ref: '#/components/parameters/ExchangeId'
      responses:
        '200':
          description: Image bytes.
          content:
            image/*: { schema: { type: string, format: binary } }
        '404':
          description: No image set, or exchange not found.
      tags: [Exchanges]

  /api/exchange/{exchange_id}/receipt_photos:
    post:
      summary: Upload receipt photos
      description: Only the recipient may upload photos for their receipt. Keeps at most 3.
      operationId: uploadReceiptPhotos
      parameters:
        - $ref: '#/components/parameters/ExchangeId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                photos:
                  type: array
                  items: { type: string, format: binary }
      responses:
        '200':
          description: Number of photos stored.
          content:
            application/json:
              schema:
                type: object
                properties: { count: { type: integer } }
        '403':
          description: Only the recipient can add receipt photos.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Exchange not found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          $ref: '#/components/responses/InternalError'
      tags: [Exchanges]

  /api/exchange/{exchange_id}/receipt_photo/{idx}:
    get:
      summary: Get one receipt photo
      operationId: getReceiptPhoto
      security: []
      parameters:
        - $ref: '#/components/parameters/ExchangeId'
        - name: idx
          in: path
          required: true
          schema: { type: integer, minimum: 0, maximum: 2 }
      responses:
        '200':
          description: Image bytes.
          content:
