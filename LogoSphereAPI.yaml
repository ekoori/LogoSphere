openapi: 3.0.0
info:
  title: LogoSphere API
  description: |
    API for handling user exchanges within the LogoSphere platform.

    ## Authentication

    Sessions are **server-stored** (a Cassandra-backed `sessions` table keyed
    by an opaque random `session_id`, 30-day TTL, instantly revoked on
    `/api/logout`) — not a stateless JWT. This is a deliberate choice: it
    gives immediate, no-blacklist-required revocation, and avoids managing a
    signing-key rotation policy for a token type we'd still need a DB-backed
    denylist for anyway to support logout.

    `POST /api/login` returns the session token as `session_id` in the JSON
    body. Send it back on every subsequent request as a standard bearer
    credential:

    ```
    Authorization: Bearer <session_id>
    ```

    Tokens are **never** accepted via query parameter — query strings end up
    in server logs, proxy logs, and browser history, so that transport is
    intentionally unsupported.

    The reference web client (the LogoSphere React app) additionally receives
    the same token as an `httpOnly`, `Secure`, `SameSite=Lax` cookie set on
    login, and authenticates with that cookie instead of the header. This is
    not a second, inconsistent mechanism — both resolve to the same
    server-stored session row — it's simply a stronger transport for a
    same-origin browser client: an `httpOnly` cookie can't be read by injected
    script, whereas a JS-readable `Authorization` header value would have to
    live in `localStorage`/`sessionStorage` and become an XSS exfiltration
    target. Non-browser clients (scripts, tests, mobile apps, integrations)
    should use the `Authorization: Bearer` header documented here.
  version: 1.1.0

servers:
  - url: "https://api.trustsphere.example.com"
    description: LogoSphere API server

security:
  - bearerAuth: []

paths:

  /api/login:
    post:
      summary: User Login
      description: Logs in a user using their email and password.
      operationId: loginUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  description: >-
                    Plaintext password, sent once over TLS. The server hashes
                    it (PBKDF2, via werkzeug) before ever touching storage;
                    the client does not pre-hash it. This is the normal,
                    correct approach for a password-based login endpoint —
                    pre-hashing client-side would just turn the hash into the
                    de facto password without adding real protection (see
                    SRP/OPAQUE for the actual zero-knowledge alternative,
                    which this API does not implement). The password is never
                    logged, echoed back, or included in any response.
      responses:
        '200':
          description: User successfully logged in
          content:
            application/json:
              schema:
                type: object
                properties:
                  session_id:
                    type: string
                    description: >-
                      Server-stored session token. Send it on subsequent
                      requests as `Authorization: Bearer <session_id>`. (The
                      reference web client instead uses the httpOnly cookie
                      also set on this response — see the Authentication
                      section above.)
        '401':
          description: Authentication failed
      tags:
        - Authentication
    options:
      summary: Options for User Login
      description: Retrieve the supported methods and other communicative options for the login endpoint.
      responses:
        '204':
          description: No Content
      tags:
        - Options
  /api/logout:
    post:
      summary: User Logout
      description: >-
        Ends the current session. Deletes the server-stored session row (so
        the token in `Authorization: Bearer` or the cookie becomes invalid
        immediately) and clears the session cookie for browser clients.
      operationId: logoutUser
      responses:
        200:
          description: Logout successful, session ended.
      tags:
        - Authentication
    options:
      summary: Options for User Logout
      description: Retrieve the supported methods and other communicative options for the login endpoint.
      responses:
        '204':
          description: No Content
      tags:
        - Options
  /api/check_session:
    post:
      summary: Check User Session
      description: Checks the validity of the current user session.
      operationId: postUserSession
      responses:
        200:
          description: Session is valid.
        401:
          description: Session is invalid or expired.
      tags:
        - Authentication
    get:
      summary: Check User Session
      description: >-
        Verifies whether the caller's session (from the `Authorization`
        header or session cookie) is currently valid.
      operationId: checkUserSession
      responses:
        '200':
          description: Session check successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  isLoggedIn:
                    type: boolean
                    description: Indicates whether a user is logged in or not
        '400':
          description: Bad request, possibly missing session information
      tags:
        - Authentication

  /api/register:
    post:
      summary: Register a new user
      description: Registers a new user with their name, email, and password.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
                - password
              properties:
                name:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
                  description: >-
                    Plaintext password, sent once over TLS; the server hashes
                    it before storage (see the Authentication section for why
                    client-side pre-hashing isn't done). Minimum 8 characters.
                    Never logged or returned in any response.
      responses:
        '201':
          description: User successfully registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Invalid input parameters
      tags:
        - User Management


  /api/user:
    get:
      summary: Retrieve User Profile
      description: >-
        Fetches details of the currently logged-in user, identified by the
        caller's `Authorization: Bearer <session_id>` header (or session
        cookie for the reference web client).
      operationId: getUserProfile
      responses:
        '200':
          description: User profile fetched successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_id:
                    type: string
                  email:
                    type: string
                  name:
                    type: string
                  additionalProperties:
                    type: object
        '401':
          description: Unauthorized access, session invalid or not provided
      tags:
        - User Management
    post:
      summary: Update User Profile
      description: >-
        Updates the profile information for the logged-in user, identified by
        the caller's `Authorization: Bearer <session_id>` header (or session
        cookie for the reference web client) — not by a field in the body.
      operationId: updateUserProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  description: (Optional) New email to update
                name:
                  type: string
                  description: (Optional) New name to update
      responses:
        '200':
          description: User profile updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '400':
          description: Bad request, missing or incorrect information provided
        '401':
          description: Unauthorized to update user profile
      tags:
        - User Management


  /api/meaning_trail:
    get:
      summary: Get User Meaning Trail
      description: Retrieves the trust trail for a specified user.
      operationId: getMeaning TrailDetails
      parameters:
        - name: userId
          in: query
          required: true
          schema:
            type: string
          description: The ID of the user for whom to fetch the trust trail
      responses:
        '200':
          description: Trust trail fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Meaning TrailDetails'
        '400':
          description: Bad request, possibly missing userId in query
        '405':
          description: Invalid request method. Only GET allowed.

  /api/meaning_trail/add_exchange:
    post:
      summary: Add Exchange to Meaning Trail (duplicate?)
      description: Adds a new exchange to the user's trust trail.
      operationId: addMeaning TrailExchange
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Meaning TrailExchange'
      responses:
        '200':
          description: Exchange added successfully
        '400':
          description: Bad request, possibly due to missing or incorrect data


  /api/meaning_trail/{userId}:
    get:
      summary: Get comprehensive Meaning Trail for a user
      operationId: getMeaning Trail
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: Successful retrieval of Meaning Trail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Meaning Trail'
        400:
          description: User ID not provided or invalid

  /api/meaning_trail/exchange:
    post:
      summary: Add a new exchange to the Meaning Trail
      operationId: addExchange
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Exchange'
      responses:
        200:
          description: Exchange successfully added
        400:
          description: Missing required fields

  /api/meaning_trail/comment/gratitude:
    post:
      summary: Add a gratitude comment to a exchange
      operationId: addGratitudeComment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                exchange_id:
                  type: string
                  format: uuid
                comment:
                  type: string
      responses:
        200:
          description: Comment added successfully
        400:
          description: Missing required data or exchange not found

  /api/openings/post_service:
    post:
      summary: Post a Service
      description: Allows a user to post a new service to the openings.
      operationId: postService
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
                - description
                - is_part_of_project
              properties:
                title:
                  type: string
                description:
                  type: string
                is_part_of_project:
                  type: boolean
                  description: Indicates whether the service is part of an existing project.
      responses:
        '201':
          description: Service successfully posted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Service successfully posted."
        '400':
          description: Bad request, possibly missing or incorrect information provided
      tags:
        - Openings
  
  /api/openings/browse_services:
    get:
      summary: Browse Services
      description: Retrieve a list of services based on specified filters.
      operationId: browseServices
      parameters:
        - name: filter
          in: query
          required: false
          schema:
            type: string
            description: Filter criteria for browsing services.
      responses:
        '200':
          description: Successfully retrieved list of services
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Service'
        '400':
          description: Incorrect filter specification
      tags:
        - Openings

  /api/openings/request_service:
    post:
      summary: Request a Service
      description: Allows a user to request a service.
      operationId: requestService
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - service_id
                - user_id
              properties:
                service_id:
                  type: string
                  format: uuid
                user_id:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Service request successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Service request successful."
        '400':
          description: Bad request, possibly due to incorrect service or user ID
      tags:
        - Openings

  /api/openings/accept_service:
    post:
      summary: Accept a Service
      description: Accepts a service offer, initiating an active exchange.
      operationId: acceptService
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - service_id
                - user_id
              properties:
                service_id:
                  type: string
                  format: uuid
                user_id:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Service accepted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Service accepted successfully."
        '400':
          description: Bad request, possibly due to incorrect service or user ID
      tags:
        - Openings
  /api/alliances:
    post:
      summary: Create a new union
      description: Allows an authorized user to create a new union.
      operationId: createAlliance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Alliance'
      responses:
        '201':
          description: Alliance created successfully.
        '400':
          description: Bad request, possibly missing required data.
      tags:
        - Alliances
  /api/alliances/{unionId}:
    get:
      summary: Retrieve a union's details
      description: Returns detailed information about a union, including its members.
      operationId: getAlliance
      parameters:
        - name: unionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Successfully retrieved union details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Alliance'
        '404':
          description: Alliance not found.
      tags:
        - Alliances

    patch:
      summary: Update a union's details
      description: Allows modifications to a union's details like name or description.
      operationId: updateAlliance
      parameters:
        - name: unionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
      responses:
        '200':
          description: Alliance updated successfully.
        '400':
          description: Bad request, invalid data provided.
        '404':
          description: Alliance not found.
      tags:
        - Alliances

    delete:
      summary: Delete a union
      description: Removes a union from the system. Should actually be deactivated instead of deleted.
      operationId: deleteAlliance
      parameters:
        - name: unionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Alliance deleted successfully.
        '404':
          description: Alliance not found.
      tags:
        - Alliances







components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >-
        `Authorization: Bearer <session_id>`, where `session_id` is the token
        returned by `POST /api/login`. See the top-level Authentication
        section for the full model (server-stored sessions; cookie transport
        for the reference web client). Applies to every endpoint except
        `/api/login`, `/api/register`, and `OPTIONS` requests, which are
        marked `security: []` individually.
  schemas:
    User:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
        session_id:
          type: string
    Invitation:
      type: object
      properties:
        code:
          type: string
          format: uuid
          description: A unique identifier for the invitation.
          readOnly: true
        email:
          type: string
          format: email
          description: Email of the user to be invited.
      required:
        - email
      description: |
        This module contains the Invitation model for handling user invitation related tasks.

    Meaning TrailExchange:
      type: object
      required:
        - user_id
        - other_user_id
        - project_id
      properties:
        user_id:
          type: string
          description: The ID of the user who is initiating the exchange
        other_user_id:
          type: string
          description: The ID of the other user involved in the exchange
        project_id:
          type: string
          description: The ID of the project related to the exchange

    Meaning TrailDetails:
      type: array
      items:
        type: object
        properties:
          exchangeId:
            type: string
          involvedParties:
            type: array
            items:
              type: string
          details:
            type: object
            additionalProperties: true


    Exchange:
      type: object
      properties:
        exchange_id:
          type: string
          format: uuid
        other_user_id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        exchange_description:
          type: string
        exchange_status:
          type: string
    Meaning Trail:
      type: array
      items:
        $ref: '#/components/schemas/Exchange'

    Service:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        is_part_of_project:
          type: boolean
        service_id:
          type: string
          format: uuid


    Alliance:
      type: object
      properties:
        alliance_id:
          type: string
          format: uuid
          description: A unique identifier for this union.
        name:
          type: string
          description: The name of the union.
        members:
          type: array
          items:
            type: string
            format: uuid
          description: List of user IDs who are members of this union.
        description:
          type: string
          description: A brief description or purpose of the union.
        created_at:
          type: string
          format: date-time
          description: Timestamp of when the union was created.
      required:
        - alliance_id
        - name
        - members