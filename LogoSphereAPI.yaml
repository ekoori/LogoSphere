          description: Invalid opening id.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Opening not found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          $ref: '#/components/responses/InternalError'
      tags: [Openings]

  /api/openings/{service_id}/image:
    get:
      summary: "The opening's banner image (public, cacheable)"
      operationId: getOpeningImage
      tags: [Openings]
      security: []
      parameters:
        - { name: service_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: The image., content: { 'image/*': {} } }
        '404': { description: No image set. }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      summary: Update an opening's image
      operationId: updateOpeningImage
      parameters:
        - $ref: '#/components/parameters/ServiceId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties: { image: { type: string, format: binary } }
      responses:
        '200':
          description: Image updated.
          content:
            application/json:
              schema:
                type: object
                properties: { message: { type: string, example: Image updated } }
        '400':
          description: Missing file, unsupported format, or invalid opening id.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Not authorized to manage this opening.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Opening not found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          $ref: '#/components/responses/InternalError'
      tags: [Openings]

