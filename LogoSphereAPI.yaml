            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Opening not found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          $ref: '#/components/responses/InternalError'
      tags: [Openings]

  # ─────────────────────────── Value Cards ───────────────────────────

  /api/value_cards/{target_user_id}:
    get:
      summary: List a user's or entity's current value cards
      description: >-
        Signed-in members read each other's cards and the charters of groups
        they may see (404 otherwise). Without a session only a public sphere's
        charter, or that of an alliance or project inside one, is returned (401
        otherwise). Only the current (non-superseded) version of each card;
        edits are versioned, not overwritten in place.
      operationId: listValueCards
      security: [{}, { bearerAuth: [] }]
      parameters:
        - name: target_user_id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: A user id, or an entity id (sphere/alliance/project) for its own value cards.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ValueCard' }
        '500':
          $ref: '#/components/responses/InternalError'
      tags: [Value Cards]

  /api/value_cards:
    post:
      summary: Create a value card for the logged-in user
      operationId: createValueCard
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ValueCardInput' }
      responses:
        '201':
          description: Card created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValueCard' }
        '400':
          description: No data provided, or care_about is missing.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          $ref: '#/components/responses/InternalError'
      tags: [Value Cards]

  /api/value_cards/{card_id}:
    patch:
      summary: Edit a value card (versioned)
      description: >-
        Only the card's owner may edit it. The edit is never written in
        place: the server creates a new card with the merged fields
        (`replaces_card_id` pointing at the old card) and flips the old
        card's `is_current` to false. The old row's content is never
        mutated, so anything that already captured it (e.g. a meaning-trail
        receipt snapshot) is unaffected — full edit history survives in
        Cassandra even though only the current version is returned by
        `GET /api/value_cards/{target_user_id}`.
      operationId: editValueCard
      parameters:
        - $ref: '#/components/parameters/CardId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ValueCardInput' }
      responses:
        '200':
          description: The new current version of the card.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValueCard' }
        '400':
          description: No data provided.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: No card with that id exists for the caller.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          $ref: '#/components/responses/InternalError'
      tags: [Value Cards]
    delete:
      summary: Delete a value card
      description: Deletes only within the caller's own partition — a card_id belonging to someone else is silently a no-op.
      operationId: deleteValueCard
      parameters:
        - $ref: '#/components/parameters/CardId'
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                properties: { message: { type: string, example: deleted } }
        '500':
          $ref: '#/components/responses/InternalError'
      tags: [Value Cards]

  /api/value_cards/clone:
    post:
      summary: Clone a value card onto your own or a managed entity's Meaning Graph
      description: >-
        The client sends the full source card's field values (it already has
        them, from rendering the card) rather than a bare id — value_cards is
        keyed by (owner_id, card_id), so a card_id alone can't be looked up
        without an inefficient scan. The clone becomes a brand-new,
        independent card; it is never linked back to its source.
      operationId: cloneValueCard
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source, target_id]
              properties:
                source: { $ref: '#/components/schemas/ValueCardInput' }
                target_id:
                  type: string
                  format: uuid
                  description: The caller's own id, or an entity id the caller manages.
      responses:
        '201':
          description: New card created for the target.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValueCard' }
        '400':
          description: target_id missing, or the source card has no care_about.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Not authorized to add a value card to that target.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          $ref: '#/components/responses/InternalError'
      tags: [Value Cards]

  /api/entity_value_cards/{entity_id}:
    post:
      summary: Create a value card owned by an entity
      description: Caller must manage the sphere/alliance/project (see `can_manage_entity`).
      operationId: createEntityValueCard
      parameters:
        - $ref: '#/components/parameters/EntityId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ValueCardInput' }
      responses:
        '201':
          description: Card created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValueCard' }
        '400':
          description: No data provided, or care_about is missing.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Not authorized to manage this entity.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          $ref: '#/components/responses/InternalError'
      tags: [Value Cards]

  /api/entity_value_cards/{entity_id}/{card_id}:
    patch:
      summary: Edit an entity's value card (versioned)
      description: Same versioning behavior as `PATCH /api/value_cards/{card_id}`, scoped to an entity the caller manages.
      operationId: editEntityValueCard
      parameters:
        - $ref: '#/components/parameters/EntityId'
        - $ref: '#/components/parameters/CardId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ValueCardInput' }
      responses:
        '200':
          description: The new current version of the card.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValueCard' }
        '400':
          description: No data provided.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Not authorized to manage this entity.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: No card with that id exists for this entity.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          $ref: '#/components/responses/InternalError'
      tags: [Value Cards]
    delete:
      summary: Delete an entity's value card
      operationId: deleteEntityValueCard
      parameters:
        - $ref: '#/components/parameters/EntityId'
        - $ref: '#/components/parameters/CardId'
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                properties: { message: { type: string, example: deleted } }
        '403':
          description: Not authorized to manage this entity.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          $ref: '#/components/responses/InternalError'
      tags: [Value Cards]

  # ─────────────────────────── Notifications ───────────────────────────

  /api/notifications:
    get:
      summary: List the logged-in user's notifications
      operationId: listNotifications
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  notifications:
                    type: array
                    items: { $ref: '#/components/schemas/Notification' }
                  unread_count: { type: integer }
        '500':
          $ref: '#/components/responses/InternalError'
      tags: [Notifications]

  /api/notifications/read:
    post:
      summary: Mark one notification as read
      operationId: markNotificationRead
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [created_at, notification_id]
              properties:
                created_at: { type: string, format: date-time }
                notification_id: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties: { message: { type: string, example: ok } }
        '400':
          description: created_at/notification_id missing, or created_at isn't a valid timestamp.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          $ref: '#/components/responses/InternalError'
      tags: [Notifications]

  /api/push/devices:
    post:
      summary: Get push notifications on this phone
      description: >-
        Registers the phone's Firebase Cloud Messaging token: every in-app
        notification of the signed-in member is then also pushed to it, until
        this session ends. A phone follows whoever signed in on it last. Nothing
        is sent while the server has no Firebase key (`sending` is false).
      operationId: registerPushDevice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string, description: The phone's FCM registration token }
                platform: { type: string, enum: [android], default: android }
      responses:
        '200':
          description: Registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  registered: { type: boolean, example: true }
                  sending: { type: boolean, description: Whether the server can send pushes now }
        '400':
          description: No token, or an unknown platform.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
      tags: [Notifications]

  /api/push/devices/forget:
    post:
      summary: Stop push notifications on this phone
      description: Called at sign-out, while the session still works.
      operationId: forgetPushDevice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        '200':
          description: Forgotten
          content:
            application/json:
              schema:
                type: object
                properties: { forgotten: { type: boolean, example: true } }
        '400':
          description: No token.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
      tags: [Notifications]

  /api/notifications/read_all:
    post:
      summary: Mark all notifications as read
      operationId: markAllNotificationsRead
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties: { message: { type: string, example: ok } }
        '500':
          $ref: '#/components/responses/InternalError'
      tags: [Notifications]

